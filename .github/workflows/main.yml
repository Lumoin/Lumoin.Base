name: Lumoin.Base .NET build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    paths-ignore:
      - "**.md"
  release:
    types:
      - published

  schedule:
    # A daily build to check all is still functioning.
    - cron: "0 0 * * *"

env:
  DOTNET_ENVIRONMENT: CI
  BUILD_CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  NUGET_FEED: https://api.nuget.org/v3/index.json
  GITHUB_USER: ${{ github.repository_owner }}
  GITHUB_FEED: https://nuget.pkg.github.com/lumoin/

  # The shippable library NuGet packages, packed and uploaded in the canonical pack
  # step below. Each carries a NuGet <Description> and packs by default. As the project
  # grows, add further project names here.
  # Lumoin.Base.Libsodium is deliberately absent: it is packed by its own macOS job
  # (pack-libsodium) because its opt-in Apple mobile TFMs need the ios/maccatalyst workloads,
  # which exist only on Windows and macOS hosts.
  LIBRARY_PROJECTS: >
    Lumoin.Base
    Lumoin.Base.MemoryProtection

  # Test projects — each compiled executable is an input to dotnet-coverage in its
  # own test step below.
  BASE_TESTS: Lumoin.Base.Tests
  LIBSODIUM_TESTS: Lumoin.Base.Libsodium.Tests
  MEMORY_PROTECTION_TESTS: Lumoin.Base.MemoryProtection.Tests

  # The pinned upstream libsodium source the natives jobs build from: bump tag, version,
  # and hash together, deliberately. The binaries ship inside Lumoin.Base.Libsodium
  # (runtimes/<rid>/native shared libraries plus the ios/maccatalyst static xcframework)
  # so the package works as-is from NuGet.
  LIBSODIUM_TAG: 1.0.22-RELEASE
  LIBSODIUM_VERSION: 1.0.22
  LIBSODIUM_TARBALL_SHA256: adbdd8f16149e81ac6078a03aca6fc03b592b89ef7b5ed83841c086191be3349

  # Endpoints harden-runner is permitted to reach: NuGet feed access, dotnet tool
  # downloads, .NET SDK installation, Sigstore attestation, certificate revocation,
  # the standard api.github.com surface, and emsdk toolchain downloads for the
  # browser-wasm archive. Add to this list when adding actions or external
  # dependencies.
  COMMON_ALLOWED_ENDPOINTS: >
    aka.ms:443
    api.github.com:443
    *.actions.githubusercontent.com:443
    api.nuget.org:443
    www.nuget.org:443
    builds.dotnet.microsoft.com:443
    ci.dot.net:443
    pkgs.dev.azure.com:443
    github.com:443
    objects.githubusercontent.com:443
    release-assets.githubusercontent.com:443
    nuget.pkg.github.com:443
    fulcio.sigstore.dev:443
    rekor.sigstore.dev:443
    storage.googleapis.com:443
    cacerts.digicert.com:80
    ts-crl.ws.symantec.com:80
    crl3.digicert.com:80
    crl4.digicert.com:80
    s.symcb.com:80
    ocsp.digicert.com:80
    www.microsoft.com:80

jobs:
  build:
    name: Build Lumoin.Base packages
    permissions:
      # Most legs need only contents:read. The ubuntu-latest leg additionally writes
      # checks/pull-request comments (test summary) and produces signed artifact
      # attestations via Sigstore (id-token, attestations). GitHub does not support
      # per-matrix-leg permissions, so all legs carry the elevated set — the
      # `if: matrix.os == 'ubuntu-latest'` step guards keep the elevated capabilities
      # from being exercised on the other runners.
      checks: write
      pull-requests: write
      id-token: write
      attestations: write
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - ubuntu-24.04-arm

    steps:
    - name: Harden Runner
      if: ${{ matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm' }}
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        disable-sudo: true
        egress-policy: block
        allowed-endpoints: ${{ env.COMMON_ALLOWED_ENDPOINTS }}

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        cache: true
        cache-dependency-path: '**/packages.lock.json'
        global-json-file: global.json

    - name: Install dependencies
      run: dotnet restore --locked-mode

    # Local tools (the .config/dotnet-tools.json manifest) restore into the global NuGet
    # package cache, which setup-dotnet already caches via packages.lock.json — there is
    # no ~/.dotnet/tools directory to cache separately (that location is for `-g` tools,
    # and caching its non-existent path fails the post-job tar on Windows).
    - name: Restore local .NET tools
      run: dotnet tool restore

    # Compute the package version once per leg. The rules follow the sibling
    # repositories' shared convention so consumers comparing them see one
    # version-numbering style:
    #   release         -> "<tag>+<sha7>"        (e.g. 1.2.0+ab12cd3)
    #   develop branch  -> "<tag>-develop.<run>+<sha7>"
    #   anything else   -> "<tag>-build.<run>+<sha7>"
    - name: Set NuGet package and suffix version
      run: |
        latestTag=$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.1)
        if [[ $GITHUB_EVENT_NAME == 'release' ]]; then
          arrTag=(${GITHUB_REF//\// })
          VERSION="${arrTag[2]}"
          VERSION="${VERSION//v}"
          echo "PACKAGE_VERSION=${VERSION}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG_VERSION=${VERSION}" >> "$GITHUB_ENV"
        elif [[ $GITHUB_REF == 'refs/heads/develop' ]]; then
          echo "PACKAGE_VERSION=${latestTag//v}-develop.${GITHUB_RUN_ID}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VERSION=${latestTag//v}-develop.${GITHUB_RUN_ID}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "TAG_VERSION=${latestTag//v}" >> "$GITHUB_ENV"
        else
          echo "PACKAGE_VERSION=${latestTag//v}-build.${GITHUB_RUN_ID}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VERSION=${latestTag//v}-build.${GITHUB_RUN_ID}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "TAG_VERSION=${latestTag//v}" >> "$GITHUB_ENV"
        fi
      shell: bash

    # ContinuousIntegrationBuild flips SourceLink and deterministic-build behaviour on.
    - name: Build
      run: dotnet build Lumoin.Base.slnx --tl --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --property:ContinuousIntegrationBuild=true --property:Version=${{ env.VERSION }} --property:InformationalVersion=${{ env.PACKAGE_VERSION }} --property:AssemblyVersion=${{ env.TAG_VERSION }} --property:FileVersion=${{ env.TAG_VERSION }}
      timeout-minutes: 15

    # dotnet-coverage runs the test binary as a child process and records cobertura
    # coverage + a TRX report. The test executable has no extension on Linux/macOS,
    # so the same command works everywhere — the host shell finds the binary by name.
    - name: Test
      run: dotnet tool run dotnet-coverage collect --output '${{ github.workspace }}/reports/coverage.cobertura.xml' --output-format cobertura '${{ github.workspace }}/test/${{ env.BASE_TESTS }}/bin/${{ env.BUILD_CONFIGURATION }}/net11.0/${{ env.BASE_TESTS }}' --report-trx --report-trx-filename testresults.trx --results-directory '${{ github.workspace }}/reports'
      timeout-minutes: 20

    # Test hosts consume the library as a project reference, which does not carry the packed
    # runtimes/ binaries, and the runners ship no libsodium of their own - so the
    # libsodium-dependent tests assert inconclusive (skipped) here while the
    # availability-independent tests still execute. The natives job proves every packed binary
    # against this same suite with a hard "skipped: 0" gate.
    - name: Test (Libsodium)
      run: dotnet tool run dotnet-coverage collect --output '${{ github.workspace }}/reports/coverage-libsodium.cobertura.xml' --output-format cobertura '${{ github.workspace }}/test/${{ env.LIBSODIUM_TESTS }}/bin/${{ env.BUILD_CONFIGURATION }}/net11.0/${{ env.LIBSODIUM_TESTS }}' --report-trx --report-trx-filename testresults-libsodium.trx --results-directory '${{ github.workspace }}/reports'
      timeout-minutes: 10

    # MemoryProtection P/Invokes only kernel32/libc, which every runner ships, so this
    # suite runs for real on all four legs — VirtualLock on Windows, mlock elsewhere.
    - name: Test (MemoryProtection)
      run: dotnet tool run dotnet-coverage collect --output '${{ github.workspace }}/reports/coverage-memoryprotection.cobertura.xml' --output-format cobertura '${{ github.workspace }}/test/${{ env.MEMORY_PROTECTION_TESTS }}/bin/${{ env.BUILD_CONFIGURATION }}/net11.0/${{ env.MEMORY_PROTECTION_TESTS }}' --report-trx --report-trx-filename testresults-memoryprotection.trx --results-directory '${{ github.workspace }}/reports'
      timeout-minutes: 10


    - name: Create test summary
      if: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
      uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3
      with:
        trx_files: '${{ github.workspace }}/reports/**/*.trx'

  # Builds the libsodium native binaries that ship inside Lumoin.Base.Libsodium. Every leg
  # downloads the pinned upstream release tarball, verifies it against the pinned SHA-256, and
  # builds it on a GitHub-hosted runner. The gate is two-tier. Host legs (kind: host) prove the
  # binary by running the Lumoin.Base.Libsodium test suite against it with a hard "skipped: 0"
  # gate: the suite skips as inconclusive without a working library, so a binary that fails to
  # load cannot pass silently. The browser-wasm leg (kind: wasm) gets the same execution proof:
  # it builds the static archive at the wasm-tools workload's pinned Emscripten and runs the
  # Lumoin.Base.Libsodium.WasmSmoke app against it under the workload's Node. Cross-compiled
  # legs (kind: android here, plus the natives-apple-mobile job below) cannot execute their
  # output on the build runner, so they ship on provenance instead: the pinned
  # checksum-verified source plus architecture and exported-symbol verification of each
  # artifact.
  natives:
    name: libsodium ${{ matrix.rid }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, kind: host, msvc-platform: x64 }
          - { os: windows-11-arm, rid: win-arm64, kind: host, msvc-platform: ARM64 }
          - { os: ubuntu-latest, rid: linux-x64, kind: host }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, kind: host }
          - { os: macos-15-intel, rid: osx-x64, kind: host }
          - { os: macos-latest, rid: osx-arm64, kind: host }
          # NDK cross-builds; the per-arch dist-build wrapper names its output prefix after the
          # compiler -march value, not the Android ABI, hence android-prefix.
          - { os: ubuntu-latest, rid: android-arm64, kind: android, android-script: android-armv8-a.sh, android-prefix: libsodium-android-armv8-a+crypto }
          - { os: ubuntu-latest, rid: android-x64, kind: android, android-script: android-x86_64.sh, android-prefix: libsodium-android-westmere }
          # The browser static archive: built at the exact Emscripten version the pinned SDK's
          # wasm-tools workload uses, and proven by executing the Lumoin.Base.Libsodium.WasmSmoke
          # app under Node — the same full execution gate the host legs get.
          - { os: ubuntu-latest, rid: browser-wasm, kind: wasm }
    steps:
    - name: Harden Runner
      if: ${{ runner.os == 'Linux' }}
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        disable-sudo: true
        egress-policy: block
        allowed-endpoints: ${{ env.COMMON_ALLOWED_ENDPOINTS }}

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    # The SDK and the wasm-tools workload are installed into a runner-writable directory: the
    # runner's default /usr/share/dotnet needs sudo for workload installs, and harden-runner runs
    # with sudo disabled. Set via GITHUB_ENV in a step because the runner context does not exist
    # in workflow-level env — a workflow that references it there fails to parse and never runs
    # at all (schedule and dispatch alike).
    - name: Point the .NET install at a runner-writable directory
      if: ${{ matrix.kind == 'wasm' }}
      run: |
        echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"
        echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"

    # Only the host legs run the test-suite gate; the Android cross-build legs never execute
    # .NET and skip the SDK setup entirely.
    - name: Set up .NET SDK
      if: ${{ matrix.kind == 'host' || matrix.kind == 'wasm' }}
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        cache: true
        cache-dependency-path: '**/packages.lock.json'
        global-json-file: global.json

    - name: Install dependencies
      if: ${{ matrix.kind == 'host' }}
      run: dotnet restore --locked-mode

    # The workload manifests of a release-candidate SDK are prerelease packages themselves.
    - name: Install the wasm-tools workload
      if: ${{ matrix.kind == 'wasm' }}
      run: dotnet workload install wasm-tools --include-previews

    - name: Discover the workload's Emscripten pin
      if: ${{ matrix.kind == 'wasm' }}
      id: emsdk
      run: |
        set -euo pipefail
        pin="$(ls "$DOTNET_ROOT/packs" | grep -oP '^Microsoft\.NET\.Runtime\.Emscripten\.\K[0-9]+\.[0-9]+\.[0-9]+(?=\.Sdk\.)' | head -n 1)"
        test -n "$pin"
        echo "Workload Emscripten pin: $pin"
        echo "version=$pin" >> "$GITHUB_OUTPUT"

    - name: Download and verify the pinned libsodium source (Unix)
      if: ${{ runner.os != 'Windows' }}
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/libsodium.tar.gz" "https://github.com/jedisct1/libsodium/releases/download/${LIBSODIUM_TAG}/libsodium-${LIBSODIUM_VERSION}.tar.gz"
        echo "${LIBSODIUM_TARBALL_SHA256}  $RUNNER_TEMP/libsodium.tar.gz" | shasum -a 256 -c -
        mkdir -p "$RUNNER_TEMP/libsodium-src"
        tar -xzf "$RUNNER_TEMP/libsodium.tar.gz" -C "$RUNNER_TEMP/libsodium-src" --strip-components=1

    - name: Download and verify the pinned libsodium source (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $tarball = Join-Path $env:RUNNER_TEMP 'libsodium.tar.gz'
        Invoke-WebRequest -Uri "https://github.com/jedisct1/libsodium/releases/download/$env:LIBSODIUM_TAG/libsodium-$env:LIBSODIUM_VERSION.tar.gz" -OutFile $tarball
        $hash = (Get-FileHash $tarball -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($hash -ne $env:LIBSODIUM_TARBALL_SHA256.ToLowerInvariant()) { throw "SHA-256 mismatch: $hash" }
        $src = Join-Path $env:RUNNER_TEMP 'libsodium-src'
        New-Item -ItemType Directory -Force $src | Out-Null
        tar -xzf $tarball -C $src --strip-components=1

    - name: Build libsodium (Unix)
      if: ${{ runner.os != 'Windows' && matrix.kind == 'host' }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/libsodium-src"
        ./configure --prefix="$RUNNER_TEMP/libsodium-out"
        make -j"$(getconf _NPROCESSORS_ONLN)"
        make install
        mkdir -p "$RUNNER_TEMP/staging/${{ matrix.rid }}/native"
        # Ship the real shared object under the flat name the .NET loader probes for module
        # "libsodium"; the versioned file is resolved through the symlink make install created.
        if [ "${{ runner.os }}" = "Linux" ]; then
          cp "$(readlink -f "$RUNNER_TEMP/libsodium-out/lib/libsodium.so")" "$RUNNER_TEMP/staging/${{ matrix.rid }}/native/libsodium.so"
        else
          cp "$(readlink -f "$RUNNER_TEMP/libsodium-out/lib/libsodium.dylib")" "$RUNNER_TEMP/staging/${{ matrix.rid }}/native/libsodium.dylib"
        fi

    # The upstream per-arch wrapper drives the NDK toolchain the ubuntu image preinstalls
    # (ANDROID_NDK_HOME): --disable-soname-versions yields the flat libsodium.so name and
    # LDFLAGS already carry the 16 KiB max-page-size Android 15+ requires. The Android scripts
    # default to --enable-minimal, so LIBSODIUM_FULL_BUILD keeps the API surface identical to
    # every other packed binary. NDK_PLATFORM android-21 is the .NET for Android minimum.
    - name: Build libsodium (Android)
      if: ${{ matrix.kind == 'android' }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/libsodium-src"
        export NDK_PLATFORM=android-21
        export LIBSODIUM_FULL_BUILD=Y
        ./dist-build/${{ matrix.android-script }}
        mkdir -p "$RUNNER_TEMP/staging/${{ matrix.rid }}/native"
        cp "./${{ matrix.android-prefix }}/lib/libsodium.so" "$RUNNER_TEMP/staging/${{ matrix.rid }}/native/libsodium.so"
      timeout-minutes: 15

    - name: Build libsodium (browser-wasm)
      if: ${{ matrix.kind == 'wasm' }}
      run: |
        set -euo pipefail
        pin='${{ steps.emsdk.outputs.version }}'
        git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
        "$RUNNER_TEMP/emsdk/emsdk" install "$pin"
        "$RUNNER_TEMP/emsdk/emsdk" activate "$pin"
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        cd "$RUNNER_TEMP/libsodium-src"
        emconfigure ./configure --disable-shared --without-pthreads --disable-ssp --disable-asm --disable-pie --prefix="$RUNNER_TEMP/libsodium-wasm"
        emmake make -j"$(nproc)" install
        mkdir -p "$RUNNER_TEMP/staging/browser-wasm/native"
        cp "$RUNNER_TEMP/libsodium-wasm/lib/libsodium.a" "$RUNNER_TEMP/staging/browser-wasm/native/libsodium.a"
        # The archive links only against this Emscripten; the package's buildTransitive targets
        # compare the stamp with the consumer's workload pin and warn on a mismatch (LUMOIN0001).
        printf '%s\n' "$pin" > "$RUNNER_TEMP/staging/browser-wasm/native/libsodium.a.emscripten-version"
      timeout-minutes: 20

    - name: Build libsodium (Windows, MSVC)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
        if (-not $msbuild) { throw 'MSBuild not found.' }
        $src = Join-Path $env:RUNNER_TEMP 'libsodium-src'
        & $msbuild (Join-Path $src 'builds\msvc\vs2022\libsodium.sln') /m /p:Configuration=DynRelease /p:Platform=${{ matrix.msvc-platform }} /v:minimal
        if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with $LASTEXITCODE" }
        $dll = Get-ChildItem (Join-Path $src 'bin') -Recurse -Filter libsodium.dll | Where-Object { $_.DirectoryName -match 'dynamic' } | Select-Object -First 1
        if (-not $dll) { throw 'libsodium.dll not produced.' }
        $stage = Join-Path $env:RUNNER_TEMP "staging\${{ matrix.rid }}\native"
        New-Item -ItemType Directory -Force $stage | Out-Null
        Copy-Item $dll.FullName (Join-Path $stage 'libsodium.dll')

    - name: Prove the binary with the Lumoin.Base.Libsodium test suite (Unix)
      if: ${{ runner.os != 'Windows' && matrix.kind == 'host' }}
      run: |
        set -euo pipefail
        dotnet build test/Lumoin.Base.Libsodium.Tests/Lumoin.Base.Libsodium.Tests.csproj --configuration "$BUILD_CONFIGURATION" --no-restore
        ext=so; [ "${{ runner.os }}" = "macOS" ] && ext=dylib
        export LUMOIN_SODIUM_LIBRARY="$RUNNER_TEMP/staging/${{ matrix.rid }}/native/libsodium.$ext"
        out="$("./test/Lumoin.Base.Libsodium.Tests/bin/$BUILD_CONFIGURATION/net11.0/Lumoin.Base.Libsodium.Tests")"
        echo "$out"
        echo "$out" | grep -q "failed: 0" || { echo "Test failures against the built binary."; exit 1; }
        echo "$out" | grep -q "skipped: 0" || { echo "Suite skipped tests: the built binary did not load."; exit 1; }
      timeout-minutes: 10

    - name: Prove the binary with the Lumoin.Base.Libsodium test suite (Windows)
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        dotnet build test/Lumoin.Base.Libsodium.Tests/Lumoin.Base.Libsodium.Tests.csproj --configuration $env:BUILD_CONFIGURATION --no-restore
        if ($LASTEXITCODE -ne 0) { throw 'Test build failed.' }
        $env:LUMOIN_SODIUM_LIBRARY = Join-Path $env:RUNNER_TEMP "staging\${{ matrix.rid }}\native\libsodium.dll"
        $out = & ".\test\Lumoin.Base.Libsodium.Tests\bin\$env:BUILD_CONFIGURATION\net11.0\Lumoin.Base.Libsodium.Tests.exe" | Out-String
        Write-Host $out
        if ($LASTEXITCODE -ne 0) { throw "Test run failed with $LASTEXITCODE" }
        if ($out -notmatch 'failed: 0') { throw 'Test failures against the built binary.' }
        if ($out -notmatch 'skipped: 0') { throw 'Suite skipped tests: the built binary did not load.' }
      timeout-minutes: 10

    # The same full execution gate the host legs get, so the browser archive never ships
    # unproven: publish the smoke app against the freshly built static archive and run it under
    # the wasm-tools workload's Node.
    - name: Prove the archive with the wasm smoke
      if: ${{ matrix.kind == 'wasm' }}
      working-directory: test/Lumoin.Base.Libsodium.WasmSmoke
      run: |
        set -euo pipefail
        dotnet publish -c Release "-p:LibsodiumStaticLibrary=$RUNNER_TEMP/staging/browser-wasm/native/libsodium.a"
        node="$(ls -d "$DOTNET_ROOT"/packs/Microsoft.NET.Runtime.Emscripten.*.Node.linux-x64/*/tools/bin/node | head -n 1)"
        "$node" --version
        # .NET 11's wasm runtime uses the exnref exception-handling proposal; the workload's
        # Node needs the flag until exnref is on by default in its V8.
        "$node" --experimental-wasm-exnref bin/Release/net11.0/publish/wwwroot/main.mjs

    # An Android binary cannot execute on the build runner, so this leg's gate is provenance:
    # the pinned checksum-verified source above, plus the machine architecture, the exported
    # sodium_init symbol, and the 16 KiB LOAD alignment Android 15 requires. This is a weaker
    # gate than the host legs' test-suite run — a leg that could load the binary would prove it
    # instead.
    - name: Verify the binary provenance (Android)
      if: ${{ matrix.kind == 'android' }}
      run: |
        set -euo pipefail
        lib="$RUNNER_TEMP/staging/${{ matrix.rid }}/native/libsodium.so"
        case "${{ matrix.rid }}" in
          android-arm64) expected='AArch64' ;;
          android-x64) expected='X86-64' ;;
          *) echo "No expected machine for ${{ matrix.rid }}"; exit 1 ;;
        esac
        readelf -h "$lib" | grep -qi "$expected" || { echo "Wrong machine architecture:"; readelf -h "$lib"; exit 1; }
        nm -D "$lib" | grep ' T sodium_init' >/dev/null || { echo "sodium_init is not exported."; exit 1; }
        readelf -lW "$lib" | awk '$1 == "LOAD" { print $NF }' | while read -r align; do
          [ $((align)) -ge 16384 ] || { echo "LOAD alignment $align is under 16 KiB."; exit 1; }
        done
        sha256sum "$lib"

    - name: Upload staged native binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: native-${{ matrix.rid }}
        path: ${{ runner.temp }}/staging/
        if-no-files-found: error

  # Builds the iOS and Mac Catalyst static libsodium slices from the same pinned,
  # checksum-verified tarball and assembles them into one xcframework. The configure flags
  # mirror upstream dist-build/apple-xcframework.sh, narrowed to the slices .NET targets
  # (arm64 device; arm64/x86_64 simulator and Catalyst; no arm64e, watchOS, tvOS or visionOS),
  # which turns upstream's 28 sequential configure+make passes into 5. These platforms do not
  # consume runtimes/<rid>/native shared libraries — the consuming app links the static archive
  # through the NativeReference added by the package's buildTransitive targets — so this
  # artifact deliberately does NOT match the native-* pattern the pack job merges under
  # runtimes/. Like the Android legs, the slices cannot execute on the build runner and ship on
  # provenance (pinned source plus architecture and symbol verification), not the test-suite
  # gate.
  natives-apple-mobile:
    name: libsodium ios/maccatalyst xcframework
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Download and verify the pinned libsodium source
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/libsodium.tar.gz" "https://github.com/jedisct1/libsodium/releases/download/${LIBSODIUM_TAG}/libsodium-${LIBSODIUM_VERSION}.tar.gz"
        echo "${LIBSODIUM_TARBALL_SHA256}  $RUNNER_TEMP/libsodium.tar.gz" | shasum -a 256 -c -
        mkdir -p "$RUNNER_TEMP/libsodium-src"
        tar -xzf "$RUNNER_TEMP/libsodium.tar.gz" -C "$RUNNER_TEMP/libsodium-src" --strip-components=1

    - name: Build the static slices and assemble the xcframework
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/libsodium-src"
        XCODEDIR="$(xcode-select -p)"
        test -d "${XCODEDIR}/Platforms/iPhoneOS.platform" || { echo "Xcode with the iOS SDK is required."; exit 1; }
        PROCESSORS="$(getconf _NPROCESSORS_ONLN)"
        SLICES="$RUNNER_TEMP/slices"

        # iOS 12.2 is the .NET minimum supported deployment target; the 13.1 Catalyst -macabi
        # targets below match upstream. Flags per slice mirror dist-build/apple-xcframework.sh.
        IOS_VERSION_MIN=12.2

        build_slice() {
          slice_name=$1; host=$2; cross=$3
          make distclean >/dev/null 2>&1 || true
          if [ -n "$cross" ]; then
            ./configure "$cross" --host="$host" --prefix="$SLICES/$slice_name"
          else
            ./configure --host="$host" --prefix="$SLICES/$slice_name"
          fi
          make -j"$PROCESSORS" install
        }

        SDK="${XCODEDIR}/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
        export CFLAGS="-O3 -arch arm64 -isysroot ${SDK} -mios-version-min=${IOS_VERSION_MIN}"
        export LDFLAGS="-arch arm64 -isysroot ${SDK} -mios-version-min=${IOS_VERSION_MIN}"
        build_slice ios-arm64 aarch64-apple-darwin23 ''

        SDK="${XCODEDIR}/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk"
        export CFLAGS="-O3 -arch arm64 -isysroot ${SDK} -mios-simulator-version-min=${IOS_VERSION_MIN}"
        export LDFLAGS="-arch arm64 -isysroot ${SDK} -mios-simulator-version-min=${IOS_VERSION_MIN}"
        build_slice ios-sim-arm64 aarch64-apple-darwin23 ''
        export CFLAGS="-O3 -arch x86_64 -isysroot ${SDK} -mios-simulator-version-min=${IOS_VERSION_MIN}"
        export LDFLAGS="-arch x86_64 -isysroot ${SDK} -mios-simulator-version-min=${IOS_VERSION_MIN}"
        build_slice ios-sim-x86_64 x86_64-apple-darwin23 cross_compiling=yes

        SDK="${XCODEDIR}/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
        export CFLAGS="-O3 -arch arm64 -target arm64-apple-ios13.1-macabi -isysroot ${SDK}"
        export LDFLAGS="-arch arm64 -target arm64-apple-ios13.1-macabi -isysroot ${SDK}"
        build_slice catalyst-arm64 aarch64-apple-ios ''
        export CFLAGS="-O3 -arch x86_64 -target x86_64-apple-ios13.1-macabi -isysroot ${SDK}"
        export LDFLAGS="-arch x86_64 -target x86_64-apple-ios13.1-macabi -isysroot ${SDK}"
        build_slice catalyst-x86_64 x86_64-apple-ios cross_compiling=yes

        # One fat archive per xcframework library slot. No -headers: the P/Invoke binding needs
        # no C headers, and omitting them keeps the packed xcframework lean.
        mkdir -p "$RUNNER_TEMP/bundles/ios" "$RUNNER_TEMP/bundles/ios-simulator" "$RUNNER_TEMP/bundles/catalyst"
        cp "$SLICES/ios-arm64/lib/libsodium.a" "$RUNNER_TEMP/bundles/ios/libsodium.a"
        lipo -create "$SLICES/ios-sim-arm64/lib/libsodium.a" "$SLICES/ios-sim-x86_64/lib/libsodium.a" -output "$RUNNER_TEMP/bundles/ios-simulator/libsodium.a"
        lipo -create "$SLICES/catalyst-arm64/lib/libsodium.a" "$SLICES/catalyst-x86_64/lib/libsodium.a" -output "$RUNNER_TEMP/bundles/catalyst/libsodium.a"

        mkdir -p "$RUNNER_TEMP/xcframework-staging"
        xcodebuild -create-xcframework \
          -library "$RUNNER_TEMP/bundles/ios/libsodium.a" \
          -library "$RUNNER_TEMP/bundles/ios-simulator/libsodium.a" \
          -library "$RUNNER_TEMP/bundles/catalyst/libsodium.a" \
          -output "$RUNNER_TEMP/xcframework-staging/libsodium.xcframework"
      timeout-minutes: 30

    # Same provenance gate as the Android legs: these archives cannot execute here, so verify
    # architectures, the sodium_init symbol in every architecture slice, and the xcframework
    # manifest. The symbol check names each -arch explicitly — llvm-nm otherwise dumps only the
    # host-arch slice of a universal archive, silently skipping the x86_64 halves on this arm64
    # runner — and uses plain grep >/dev/null rather than grep -q so nm's output is drained and
    # can never die on a closed pipe under pipefail.
    - name: Verify the xcframework provenance
      run: |
        set -euo pipefail
        xcf="$RUNNER_TEMP/xcframework-staging/libsodium.xcframework"
        plutil -lint "$xcf/Info.plist"
        slice_count=$(find "$xcf" -name libsodium.a | wc -l | tr -d ' ')
        [ "$slice_count" -eq 3 ] || { echo "Expected 3 slices, found $slice_count."; exit 1; }
        lipo -archs "$RUNNER_TEMP/bundles/ios/libsodium.a" | grep -w arm64 >/dev/null
        for b in ios-simulator catalyst; do
          archs=$(lipo -archs "$RUNNER_TEMP/bundles/$b/libsodium.a")
          echo "$archs" | grep -w arm64 >/dev/null || { echo "$b is missing arm64."; exit 1; }
          echo "$archs" | grep -w x86_64 >/dev/null || { echo "$b is missing x86_64."; exit 1; }
        done
        find "$xcf" -name libsodium.a | while read -r a; do
          for arch in $(lipo -archs "$a"); do
            nm -g -arch "$arch" "$a" | grep ' T _sodium_init' >/dev/null || { echo "sodium_init missing in $a ($arch)."; exit 1; }
          done
        done
        find "$xcf" -type f -exec shasum -a 256 {} \;

    - name: Upload the xcframework
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: xcframework-ios-maccatalyst
        path: ${{ runner.temp }}/xcframework-staging/
        if-no-files-found: error

  # Packing is canonical: one package per release per runner. This job packs the projects with
  # no native payload (LIBRARY_PROJECTS); Lumoin.Base.Libsodium is packed by pack-libsodium
  # below, which needs the natives artifacts and the Apple workloads.
  pack:
    name: Pack library NuGet packages
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: [ build ]
    if: ${{ github.repository_owner == 'lumoin' }}
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        disable-sudo: true
        egress-policy: block
        allowed-endpoints: ${{ env.COMMON_ALLOWED_ENDPOINTS }}

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        cache: true
        cache-dependency-path: '**/packages.lock.json'
        global-json-file: global.json

    - name: Install dependencies
      run: dotnet restore --locked-mode

    # Compute the package version with the same rules as the build legs (see the comment there).
    - name: Set NuGet package and suffix version
      run: |
        latestTag=$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.1)
        if [[ $GITHUB_EVENT_NAME == 'release' ]]; then
          arrTag=(${GITHUB_REF//\// })
          VERSION="${arrTag[2]}"
          VERSION="${VERSION//v}"
          echo "PACKAGE_VERSION=${VERSION}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG_VERSION=${VERSION}" >> "$GITHUB_ENV"
        elif [[ $GITHUB_REF == 'refs/heads/develop' ]]; then
          echo "PACKAGE_VERSION=${latestTag//v}-develop.${GITHUB_RUN_ID}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VERSION=${latestTag//v}-develop.${GITHUB_RUN_ID}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "TAG_VERSION=${latestTag//v}" >> "$GITHUB_ENV"
        else
          echo "PACKAGE_VERSION=${latestTag//v}-build.${GITHUB_RUN_ID}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VERSION=${latestTag//v}-build.${GITHUB_RUN_ID}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "TAG_VERSION=${latestTag//v}" >> "$GITHUB_ENV"
        fi
      shell: bash

    - name: Build
      run: dotnet build Lumoin.Base.slnx --tl --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --property:ContinuousIntegrationBuild=true --property:Version=${{ env.VERSION }} --property:InformationalVersion=${{ env.PACKAGE_VERSION }} --property:AssemblyVersion=${{ env.TAG_VERSION }} --property:FileVersion=${{ env.TAG_VERSION }}
      timeout-minutes: 15

    - name: Pack library NuGet packages
      run: |
        for project in $LIBRARY_PROJECTS; do
          path="src/$project/$project.csproj"
          echo "Packing $path"
          dotnet pack --verbosity normal \
            --configuration "$BUILD_CONFIGURATION" \
            --no-build \
            --output nupkgs \
            --property:PackageVersion="${PACKAGE_VERSION%%+*}" \
            "$path"
        done

    # Sigstore artifact attestation needs the public-good Fulcio/Rekor transparency
    # log, unavailable while the repository is private — the step errors with the
    # current plan. Gated on repository visibility so it is skipped while private and
    # turns on automatically once the repository is made public; no edit needed then.
    - name: Generate artifact attestation
      if: ${{ github.actor != 'dependabot[bot]' && github.event.repository.private == false }}
      uses: lumoin/trusted-devsecops/.github/actions/sign-artifact@bd2b7f91e73d758f3126562d6a569fc0f31814ee
      with:
        subject-path: './nupkgs/*.nupkg'

    - name: Upload library NuGet packages
      if: ${{ github.actor != 'dependabot[bot]' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: nupkg-libraries
        path: ./nupkgs/*.*

  # Packs Lumoin.Base.Libsodium on macOS: its opt-in Apple mobile TFMs (-p:LumoinAppleTfms=true,
  # compiled with the __Internal module name the statically linked xcframework requires) need
  # the ios/maccatalyst workloads, which exist only on Windows and macOS hosts — the ubuntu pack
  # job cannot even restore that TFM set. Restores against the committed packages.apple.lock.json.
  # step-security/harden-runner supports only Linux, so this job runs without it, matching the
  # repository's macOS natives legs.
  pack-libsodium:
    name: Pack Lumoin.Base.Libsodium NuGet package
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: [ build, natives, natives-apple-mobile ]
    if: ${{ github.repository_owner == 'lumoin' }}
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        cache: true
        cache-dependency-path: '**/packages*.lock.json'
        global-json-file: global.json

    # Workload versions ride the SDK band resolved from global.json; the workload manifests and
    # packs come from nuget.org like every other dependency. The manifests of a release-candidate
    # SDK are prerelease packages themselves, hence --include-previews.
    - name: Install the ios and maccatalyst workloads
      run: dotnet workload install ios maccatalyst --include-previews
      timeout-minutes: 15

    - name: Install dependencies
      run: dotnet restore src/Lumoin.Base.Libsodium/Lumoin.Base.Libsodium.csproj --locked-mode --property:LumoinAppleTfms=true

    # Compute the package version with the same rules as the build legs (see the comment there).
    - name: Set NuGet package and suffix version
      run: |
        latestTag=$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.1)
        if [[ $GITHUB_EVENT_NAME == 'release' ]]; then
          arrTag=(${GITHUB_REF//\// })
          VERSION="${arrTag[2]}"
          VERSION="${VERSION//v}"
          echo "PACKAGE_VERSION=${VERSION}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG_VERSION=${VERSION}" >> "$GITHUB_ENV"
        elif [[ $GITHUB_REF == 'refs/heads/develop' ]]; then
          echo "PACKAGE_VERSION=${latestTag//v}-develop.${GITHUB_RUN_ID}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VERSION=${latestTag//v}-develop.${GITHUB_RUN_ID}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "TAG_VERSION=${latestTag//v}" >> "$GITHUB_ENV"
        else
          echo "PACKAGE_VERSION=${latestTag//v}-build.${GITHUB_RUN_ID}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VERSION=${latestTag//v}-build.${GITHUB_RUN_ID}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "TAG_VERSION=${latestTag//v}" >> "$GITHUB_ENV"
        fi
      shell: bash

    - name: Build
      run: dotnet build src/Lumoin.Base.Libsodium/Lumoin.Base.Libsodium.csproj --tl --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --property:LumoinAppleTfms=true --property:ContinuousIntegrationBuild=true --property:Version=${{ env.VERSION }} --property:InformationalVersion=${{ env.PACKAGE_VERSION }} --property:AssemblyVersion=${{ env.TAG_VERSION }} --property:FileVersion=${{ env.TAG_VERSION }}
      timeout-minutes: 15

    - name: Download native binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: native-*
        merge-multiple: true
        path: ./native-staging

    # The ios/maccatalyst xcframework travels under its own artifact name and staging
    # directory: everything under native-staging is packed verbatim into runtimes/, where
    # Apple mobile platforms would never find it.
    - name: Download the ios/maccatalyst xcframework
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: xcframework-ios-maccatalyst
        path: ./apple-staging

    - name: Verify every native binary is present
      run: |
        set -euo pipefail
        for f in win-x64/native/libsodium.dll win-arm64/native/libsodium.dll linux-x64/native/libsodium.so linux-arm64/native/libsodium.so osx-x64/native/libsodium.dylib osx-arm64/native/libsodium.dylib android-arm64/native/libsodium.so android-x64/native/libsodium.so browser-wasm/native/libsodium.a browser-wasm/native/libsodium.a.emscripten-version; do
          test -f "./native-staging/$f" || { echo "Missing $f"; exit 1; }
        done
        test -f ./apple-staging/libsodium.xcframework/Info.plist || { echo "Missing the xcframework manifest."; exit 1; }
        slice_count=$(find ./apple-staging/libsodium.xcframework -name libsodium.a | wc -l | tr -d ' ')
        [ "$slice_count" -eq 3 ] || { echo "Expected 3 xcframework slices, found $slice_count."; exit 1; }
        find ./native-staging ./apple-staging -type f -exec shasum -a 256 {} \;

    - name: Pack Lumoin.Base.Libsodium
      run: |
        dotnet pack --verbosity normal \
          --configuration "$BUILD_CONFIGURATION" \
          --no-build \
          --output nupkgs \
          --property:LumoinAppleTfms=true \
          --property:PackageVersion="${PACKAGE_VERSION%%+*}" \
          --property:NativeAssetsStagingDirectory="$PWD/native-staging" \
          --property:AppleXcframeworkDirectory="$PWD/apple-staging/libsodium.xcframework" \
          src/Lumoin.Base.Libsodium/Lumoin.Base.Libsodium.csproj

    # Same gating as the pack job above: Sigstore needs the public transparency log, available
    # once the repository is public.
    - name: Generate artifact attestation
      if: ${{ github.actor != 'dependabot[bot]' && github.event.repository.private == false }}
      uses: lumoin/trusted-devsecops/.github/actions/sign-artifact@bd2b7f91e73d758f3126562d6a569fc0f31814ee
      with:
        subject-path: './nupkgs/*.nupkg'

    - name: Upload the Lumoin.Base.Libsodium NuGet package
      if: ${{ github.actor != 'dependabot[bot]' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: nupkg-libsodium
        path: ./nupkgs/*.*

  # Pre-release goes to GitHub Packages on the develop branch. The release deploy goes
  # to NuGet.org on tagged GitHub releases via NuGet trusted publishing (OIDC) — no
  # API key needed beyond a registered nuget.org profile.
  prerelease:
    name: Create and upload Lumoin.Base pre-release packages to GitHub
    permissions:
      packages: write
    needs: [ pack, pack-libsodium ]
    if: ${{ github.ref == 'refs/heads/develop' && github.repository_owner == 'lumoin' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: ${{ env.COMMON_ALLOWED_ENDPOINTS }}

      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: nupkg-*
          merge-multiple: true
          path: ./nupkgs

      - name: Push packages to GitHub feed
        run: |
          for file in ./nupkgs/*.nupkg; do
            dotnet nuget push "$file" --source "$GITHUB_FEED" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          done

  deploy:
    name: Create and upload Lumoin.Base release packages to NuGet.org
    permissions:
      packages: write
      # id-token is required for NuGet trusted publishing (OIDC).
      id-token: write
    needs: [ pack, pack-libsodium ]
    if: ${{ github.event_name == 'release' && github.repository_owner == 'lumoin' }}
    runs-on: ubuntu-latest
    # Bind publishing to the "Release" deployment environment so the OIDC token carries the
    # environment claim and deployments are recorded against it.
    environment: Release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: ${{ env.COMMON_ALLOWED_ENDPOINTS }}

      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: nupkg-*
          merge-multiple: true
          path: ./nupkgs

      - name: Push packages to GitHub feed
        run: |
          for file in ./nupkgs/*.nupkg; do
            dotnet nuget push "$file" --source "$GITHUB_FEED" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          done

      # NuGet trusted publishing: exchange the GitHub OIDC token for a short-lived API
      # key. Requires the repository to be registered as a trusted publisher in the
      # nuget.org profile owner's account (see secrets.NUGET_USER).
      - name: NuGet trusted publishing login (OIDC)
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet.org
        run: |
          for file in ./nupkgs/*.nupkg; do
            dotnet nuget push "$file" --source "$NUGET_FEED" --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --skip-duplicate
          done
