name: Lumoin.Base wasm smoke

# The natives job in main.yml builds, proves, and ships the browser-wasm libsodium archive on
# every push: it builds the static library with the wasm-tools workload's own Emscripten and
# runs this repository's Lumoin.Base.Libsodium.WasmSmoke app under Node as the execution gate.
# This leg is the weekly drift detector between those pushes: it rebuilds the archive with
# whatever Emscripten the workload currently ships and re-runs the same smoke, so a wasm-tools
# workload update that bumps the toolchain or changes wasm marshalling surfaces here first.

# Deliberately NOT triggered by push or pull_request: main.yml already builds and proves the
# archive on every push, so triggering here too would only duplicate that gate. The weekly
# schedule catches Emscripten pin bumps between pushes; run manually via workflow_dispatch when
# touching the binding.
on:
  workflow_dispatch:
  schedule:
    # Weekly: a new .NET 11 SDK may bump the pinned Emscripten; this rebuilds the static
    # libsodium at the new pin and re-runs the smoke against it.
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  NUGET_XMLDOC_MODE: skip

  # The family builds its own native assets from the pinned upstream tag — never from
  # third-party repackagings. Keep in sync with the family libsodium fork once it exists.
  LIBSODIUM_TAG: 1.0.22-RELEASE
  LIBSODIUM_VERSION: 1.0.22

  # The smoke project is deliberately outside Lumoin.Base.slnx; every dotnet invocation below
  # runs from its directory. It builds on the repository's SDK pin (global.json).
  SMOKE_DIR: test/Lumoin.Base.Libsodium.WasmSmoke

jobs:
  wasm-smoke:
    name: libsodium in dotnet.wasm (.NET 11)
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
      with:
        disable-sudo: true
        # Audit rather than block: this weekly detector exists to surface drift, and a new endpoint
        # in a workload update should be reported here rather than fail here (main.yml's natives
        # leg runs the same install under block with its allowlist and is the gate). Tighten to
        # block with that allowlist when this leg stops being experimental (.NET 11 GA).
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    # The SDK and the wasm-tools workload are installed into a runner-writable directory: the
    # runner's default /usr/share/dotnet needs sudo for workload installs, and harden-runner runs
    # with sudo disabled. Set via GITHUB_ENV in a step because the runner context does not exist
    # in workflow-level env — a workflow that references it there fails to parse and never runs
    # at all (schedule and dispatch alike).
    - name: Point the .NET install at a runner-writable directory
      run: |
        echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"
        echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        global-json-file: global.json

    # The workload manifests of a release-candidate SDK are prerelease packages themselves.
    - name: Install the wasm-tools workload
      working-directory: ${{ env.SMOKE_DIR }}
      run: dotnet workload install wasm-tools --include-previews

    # The same build as main.yml's browser-wasm natives leg: the workload's own emcc, pointed at
    # the pack's LLVM, Binaryen and Node through the DOTNET_EMSCRIPTEN_* variables the wasm SDK
    # exports when it links an app. The version is read from emscripten-version.txt, the file
    # Sdk.props reads into $(EmscriptenVersion), never from the pack directory name (the RC1
    # packs are named 6.0.2 but carry 6.0.3).
    - name: Build static libsodium with the workload's Emscripten
      run: |
        set -euo pipefail
        sdk_tools="$(ls -d "$DOTNET_ROOT"/packs/Microsoft.NET.Runtime.Emscripten.*.Sdk.linux-x64/*/tools | head -n 1)"
        node_bin="$(ls -d "$DOTNET_ROOT"/packs/Microsoft.NET.Runtime.Emscripten.*.Node.linux-x64/*/tools/bin | head -n 1)"
        cache="$(ls -d "$DOTNET_ROOT"/packs/Microsoft.NET.Runtime.Emscripten.*.Cache.linux-x64/*/tools/emscripten/cache | head -n 1)"
        version="$(tr -d '"[:space:]' < "$sdk_tools/emscripten/emscripten-version.txt")"
        test -n "$version"
        echo "Workload Emscripten version: $version"
        export DOTNET_EMSCRIPTEN_LLVM_ROOT="$sdk_tools/bin"
        export DOTNET_EMSCRIPTEN_BINARYEN_ROOT="$sdk_tools"
        export DOTNET_EMSCRIPTEN_NODE_JS="$node_bin/node"
        export EM_CACHE="$cache"
        export EM_FROZEN_CACHE=1
        export PATH="$sdk_tools/emscripten:$node_bin:$PATH"
        banner="$(emcc --version | head -n 1)"
        echo "$banner"
        reported="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' <<< "$banner" | head -n 1 || true)"
        [ "$reported" = "$version" ] || { echo "emcc reports '$reported' but emscripten-version.txt says $version."; exit 1; }
        mkdir -p "$RUNNER_TEMP/libsodium-src"
        curl -fsSL "https://github.com/jedisct1/libsodium/releases/download/${LIBSODIUM_TAG}/libsodium-${LIBSODIUM_VERSION}.tar.gz" | tar -xz -C "$RUNNER_TEMP/libsodium-src" --strip-components=1
        cd "$RUNNER_TEMP/libsodium-src"
        emconfigure ./configure --disable-shared --without-pthreads --disable-ssp --disable-asm --disable-pie --prefix="$RUNNER_TEMP/libsodium-wasm"
        emmake make -j"$(nproc)" install
        test -f "$RUNNER_TEMP/libsodium-wasm/lib/libsodium.a"
        printf '%s\n' "$version" > "$RUNNER_TEMP/libsodium-wasm/emscripten-version"

    - name: Publish the smoke app
      working-directory: ${{ env.SMOKE_DIR }}
      run: dotnet publish -c Release "-p:LibsodiumStaticLibrary=$RUNNER_TEMP/libsodium-wasm/lib/libsodium.a"

    # The version the archive is built and stamped with must be what the workload reports to a
    # consuming app as EmscriptenVersion, the value the package's targets compare the stamp with.
    - name: Check the build's Emscripten against the workload's EmscriptenVersion
      working-directory: ${{ env.SMOKE_DIR }}
      run: |
        set -euo pipefail
        consumer="$(dotnet msbuild -getProperty:EmscriptenVersion)"
        built="$(cat "$RUNNER_TEMP/libsodium-wasm/emscripten-version")"
        [ "$consumer" = "$built" ] || { echo "Built with Emscripten '$built' but the workload reports EmscriptenVersion '$consumer'."; exit 1; }

    - name: Run the smoke under the workload's Node
      working-directory: ${{ env.SMOKE_DIR }}
      run: |
        set -euo pipefail
        node="$(ls -d "$DOTNET_ROOT"/packs/Microsoft.NET.Runtime.Emscripten.*.Node.linux-x64/*/tools/bin/node | head -n 1)"
        "$node" --version
        # .NET 11's wasm runtime uses the exnref exception-handling proposal; the workload's
        # Node needs the flag until exnref is on by default in its V8.
        "$node" --experimental-wasm-exnref bin/Release/net11.0/publish/wwwroot/main.mjs
